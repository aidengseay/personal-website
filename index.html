<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View and download Aiden Seay’s professional and federal resumes.">
  <title>Aiden Seay | Resume</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #16283f; background: #eef2f6; }
    * { box-sizing: border-box; }
    body { margin: 0; border-top: 5px solid #2766a0; }
    header, main, footer { max-width: 1120px; margin: auto; padding-inline: clamp(20px, 4vw, 48px); }
    header { padding-block: 36px 28px; }
    .eyebrow { margin: 0 0 6px; color: #47617a; font-size: .875rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: -.04em; line-height: 1.15; }
    nav { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
    a { color: #205786; text-underline-offset: 4px; }
    a:hover { color: #102f4b; }
    a:focus-visible { outline: 3px solid #bc6800; outline-offset: 5px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
    .choices, .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .button { display: inline-flex; justify-content: center; align-items: center; min-height: 46px; padding: 11px 17px; border: 1px solid #b3c2d0; border-radius: 6px; text-decoration: none; font-size: 1rem; font-weight: 600; background: white; }
    .primary, .choice[aria-current="true"] { color: white; background: #173b60; border-color: #173b60; }
    .primary:hover, .choice[aria-current="true"]:hover { color: white; background: #245480; }
    .document { background: white; border: 1px solid #c7d1dd; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 35px #16283f0c; }
    .document-bar { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 16px 20px; border-bottom: 1px solid #d8e0e8; }
    h2 { margin: 0; font-size: 1rem; font-weight: 650; }
    .format, .help, footer { color: #52657a; font-size: .875rem; }
    object { display: block; width: 100%; height: max(650px, 85vh); border: 0; }
    .fallback { padding: 30px; line-height: 1.7; }
    .help { margin: 16px 0 0; line-height: 1.6; }
    footer { padding-block: 24px 32px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 600px) {
      header { padding-top: 26px; }
      .choices, .actions { width: 100%; }
      .button { flex: 1; }
      object { height: 75vh; min-height: 480px; }
      .document-bar { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Resume</p>
    <h1>Aiden Seay</h1>
    <nav aria-label="Contact and profiles">
      <a href="mailto:aidengseay@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/aidengseay">LinkedIn</a>
      <a href="https://github.com/aidengseay">GitHub</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <!-- Without JavaScript, these links open the PDFs directly. -->
      <div class="choices" role="group" aria-label="Choose a resume">
        <a class="button choice" href="./resume.pdf" data-resume="general" aria-current="true">Resume</a>
        <a class="button choice" href="./federal-resume.pdf" data-resume="federal">View Federal Resume</a>
      </div>
      <div class="actions">
        <a class="button" id="open-pdf" href="./resume.pdf" target="_blank" rel="noopener">Open PDF<span class="sr-only"> (new tab)</span></a>
        <a class="button primary" id="download-pdf" href="./resume.pdf" download="Aiden-Seay-Resume.pdf">Download resume</a>
      </div>
    </div>
    <section class="document" aria-labelledby="document-title">
      <div class="document-bar">
        <h2 id="document-title" aria-live="polite">Resume</h2>
        <span class="format">PDF document</span>
      </div>
      <object id="resume-viewer" data="./resume.pdf#view=FitH" type="application/pdf" aria-label="Aiden Seay’s resume">
        <div class="fallback"><p>Your browser cannot display this PDF here.</p><a id="fallback-link" href="./resume.pdf">Open the resume PDF</a> to read it.</div>
      </object>
    </section>
    <p class="help">Having trouble viewing the document? <a id="direct-link" href="./resume.pdf">Open the PDF directly.</a></p>
  </main>
  <footer>Aiden Seay · Resume</footer>
  <script>
    // Only these two local files can be selected. Relative paths support GitHub project sites.
    const resumes = {
      general: { file: './resume.pdf', title: 'Resume', download: 'Aiden-Seay-Resume.pdf' },
      federal: { file: './federal-resume.pdf', title: 'Federal Resume', download: 'Aiden-Seay-Federal-Resume.pdf' }
    };
    const choices = document.querySelectorAll('[data-resume]');
    function showResume(key) {
      const resume = resumes[key];
      const viewer = document.getElementById('resume-viewer');
      viewer.setAttribute('data', resume.file + '#view=FitH');
      viewer.setAttribute('aria-label', 'Aiden Seay’s ' + resume.title.toLowerCase());
      document.getElementById('document-title').textContent = resume.title;
      for (const id of ['open-pdf', 'download-pdf', 'fallback-link', 'direct-link']) {
        document.getElementById(id).setAttribute('href', resume.file);
      }
      document.getElementById('download-pdf').setAttribute('download', resume.download);
      choices.forEach(choice => {
        if (choice.dataset.resume === key) choice.setAttribute('aria-current', 'true');
        else choice.removeAttribute('aria-current');
      });
    }
    choices.forEach(choice => choice.addEventListener('click', event => {
      // Preserve standard open-in-new-tab and modified-click behavior.
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button !== 0) return;
      event.preventDefault();
      showResume(choice.dataset.resume);
    }));
  </script>
</body>
</html>
